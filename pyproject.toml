[project]
name = "trade-wiki-ai"
version = "0.1.0"
description = "AI trading knowledge assistant with distillation-based growth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "lark-oapi>=1.4",
    "ollama>=0.4",
    "chromadb>=0.4",
    "llama-index>=0.10",
    "openai>=1.30",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "docling>=1.0",
    "openai-whisper>=20231117",
    "sentence-transformers>=3.0",
    "akshare>=1.14",
    "yfinance>=0.2.37",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
train = [
    "llamafactory>=0.6",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "trl>=0.9",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
